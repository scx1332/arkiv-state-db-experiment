name: CI

on:
  push:
    branches: [main, "experimental-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: nothing here writes to the repository.
permissions:
  contents: read

env:
  # The workspace MSRV (Cargo.toml rust-version) and the local toolchain.
  RUST_TOOLCHAIN: 1.90.0
  CARGO_TERM_COLOR: always
  # The maintained crates; vendor/alloy-trie is copied upstream source and is
  # excluded from formatting and Clippy (see README.md "Development").
  PACKAGES: >-
    -p arkiv-db -p arkiv-db-storage -p arkiv-db-memory -p arkiv-db-redb
    -p arkiv-db-trie -p arkiv-node

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: cargo fmt
        run: |
          # $PACKAGES is a list of -p flags: split on purpose.
          # shellcheck disable=SC2086
          cargo fmt $PACKAGES -- --check

      - name: cargo clippy
        run: |
          # $PACKAGES is a list of -p flags: split on purpose.
          # shellcheck disable=SC2086
          cargo clippy --offline --locked --all-targets $PACKAGES -- -D warnings

      - name: cargo test
        run: cargo test --offline --locked --workspace
