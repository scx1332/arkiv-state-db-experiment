name: golem-db conformance

# Builds golem-api (golem-db's API on the arkiv engine) and runs the test
# suites written against golem-db's API on it, at pinned revisions
# (conformance/golem-db/README.md). An unexpected failure and an unexpected
# pass both fail the job. The companion workflow golem-conformance-latest.yml
# follows the upstream branches.

on:
  push:
    branches: [main, "experimental-*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC: the pinned commits must stay fetchable

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: nothing here writes to the repository.
permissions:
  contents: read

env:
  # golem-db's conformance crate: the tip of its pull-request stack
  # (ev/conformance-errors), which is golem-db main f6dae1d plus
  # crates/conformance. golem-api/Cargo.toml pins the golem-db it builds
  # against, f6dae1d. Bump both together (conformance/golem-db/README.md).
  GOLEM_DB_REV: ef6269afc03acd1b6eec5e53506216446663eca0
  # golem-db-conformance-testing, branch develop.
  HARNESS_REV: a1b6b6b6b7b6f6c5af3578df4d2e647fc443520c
  CARGO_TERM_COLOR: always

jobs:
  pinned:
    name: pinned (gating)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install clang (MDBX bindgen)
        run: sudo apt-get update -q && sudo apt-get install -y -q clang libclang-dev

      - name: Install golem-db's toolchain
        working-directory: golem-api
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: golem-api -> ../conformance/golem-db/work/target
          key: pinned-${{ env.GOLEM_DB_REV }}-${{ env.HARNESS_REV }}

      - name: Fetch the suites
        run: conformance/golem-db/ci.sh setup "$GOLEM_DB_REV" "$HARNESS_REV"

      - name: golem-api (rustfmt, clippy, its own tests)
        run: conformance/golem-db/ci.sh kit

      - name: golem-db crates/conformance (gated by expected-failures/in-repo.txt)
        run: conformance/golem-db/ci.sh in-repo

      - name: External harness, spec suite and oracle (gated by expected-failures/external.txt)
        run: conformance/golem-db/ci.sh external

      - name: Load tool smoke run (golemdb, arkiv, arkiv-memory)
        run: conformance/golem-db/ci.sh smoke
