name: Image

# Builds the node image (Dockerfile) and publishes it to GitHub Container
# Registry: ghcr.io/<owner>/arkiv-node. Runs beside CI, which tests the same
# commit. Pull requests build and smoke-test without publishing.
#
# Tags: vX.Y.Z[-pre] releases publish X.Y.Z[-pre]; main publishes `main` and
# `sha-<short>`. `latest` follows the newest release tag. Every published
# image gets a build provenance attestation (GitHub and the registry).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  image:
    name: build, smoke, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # check out the sources
      packages: write # publish to ghcr.io
      # Build provenance: a Sigstore-signed statement of which commit and run
      # built the image.
      id-token: write # OIDC identity that signs the attestation
      attestations: write # store the attestation on GitHub
      security-events: write # upload the image scan to code scanning
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/arkiv-node
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,format=short

      # The runtime stage upgrades Debian's packages. The layer cache would
      # keep that layer for as long as the Dockerfile is unchanged, and with it
      # packages that Debian has fixed since: the date makes it run once a day.
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          build-args: APT_REFRESH=${{ steps.day.outputs.day }}
          load: true
          tags: arkiv-node:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fixable HIGH and CRITICAL vulnerabilities in the image's packages stop
      # the publish. The Rust crates in the binary are checked by cargo deny and
      # cargo audit (security.yml); Trivy cannot see them in a plain binary.
      - name: Install Trivy
        run: |
          scripts/security/tools.sh "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan image (Trivy)
        run: >-
          scripts/security/check.sh "trivy image (fixable HIGH, CRITICAL)" --
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 arkiv-node:ci

      - name: Image scan report (all severities, SARIF)
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: >-
          trivy image --quiet --scanners vuln --format sarif
          --output "$RUNNER_TEMP/trivy.sarif" arkiv-node:ci

      - name: Upload image scan to code scanning
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: trivy-image

      - name: Smoke
        run: |
          docker run --rm arkiv-node:ci --version
          # A producer from a fresh allocations genesis must come up and make blocks.
          docker run --rm --entrypoint sh arkiv-node:ci -c '
            set -e
            addr=$(arkiv-proposer keygen --out /data/k)
            echo "{\"$addr\": \"1000000000000000000000\"}" > /data/alloc.json
            ARKIV_PROPOSER_TOKEN=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d " \n") \
              arkiv-proposer producer --run-dir /data/run --key-file /data/k --allocations-file /data/alloc.json \
              --start running --block-period-ms 250 > /data/log 2>&1 &
            for i in $(seq 60); do
              h=$(curl -fsS http://127.0.0.1:9500/signed/v1/status 2>/dev/null | sed -n "s/.*\"head\":{[^}]*\"height\":\"\([0-9]*\)\".*/\1/p")
              if [ -n "$h" ] && [ "$h" -ge 5 ]; then echo "producer at height $h"; exit 0; fi
              sleep 1
            done
            cat /data/log; exit 1'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          build-args: APT_REFRESH=${{ steps.day.outputs.day }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # Verify: gh attestation verify oci://ghcr.io/<owner>/arkiv-node:TAG --repo <owner>/arkiv-state-db-experiment
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/arkiv-node
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
