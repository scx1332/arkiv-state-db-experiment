[package]
name = "arkiv-node"
description = "The append-only Arkiv pseudo node: block format, deterministic execution and replay, genesis tooling, and the signed proposer, simulator and demo binaries"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
alloy-primitives = { workspace = true, features = ["k256"] }
alloy-rlp.workspace = true
alloy-sol-types = "=1.7.3"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "std"] }
arkiv-db.workspace = true
arkiv-db-trie.workspace = true
arkiv-db-storage.workspace = true
arkiv-db-redb.workspace = true
ed25519-dalek = "=2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned: its output is hashed into genesis locks (`genesis_authoring`).
toml = "=0.8.23"
sha2 = "0.10"
base64 = "0.22"
rustix = { version = "1", features = ["fs"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
getrandom = "0.3"

[dev-dependencies]
arkiv-db-memory.workspace = true
arkiv-db-storage = { workspace = true, features = ["testing"] }
arkiv-db-redb = { workspace = true, features = ["testing"] }
# The HTTP tests read and write raw sockets.
tokio = { version = "1", features = ["io-util"] }
# Used by the arkiv-db-trie test support that `tests/support/block_roots.rs`
# includes by path.
alloy-trie.workspace = true

# The example's own test module runs with `cargo test`.
[[example]]
name = "verify_inspection"
test = true

[lints]
workspace = true
