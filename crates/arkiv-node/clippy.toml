# The node reaches the engine only through its fallible `try_` API: a
# storage error of the persistent engine must abort the candidate block,
# never be unwrapped into a panic, a rejection or an empty read. These are
# the infallible forms of every Branch/Snapshot method that walks state,
# and the infallible expiry sweep. Tests that inspect the memory engine may
# allow the lint explicitly.
disallowed-methods = [
    { path = "arkiv_db::engine::Branch::execute", reason = "use try_execute" },
    { path = "arkiv_db::engine::Branch::execute_host", reason = "use try_execute_host" },
    { path = "arkiv_db::engine::Branch::estimate", reason = "use try_estimate" },
    { path = "arkiv_db::engine::Branch::estimate_host", reason = "use try_estimate_host" },
    { path = "arkiv_db::engine::Branch::get", reason = "use try_get" },
    { path = "arkiv_db::engine::Branch::scan_prefix", reason = "use try_scan_prefix" },
    { path = "arkiv_db::engine::Branch::descriptor", reason = "use try_descriptor" },
    { path = "arkiv_db::engine::Branch::get_record", reason = "use try_get_record" },
    { path = "arkiv_db::engine::Branch::query", reason = "use try_query" },
    { path = "arkiv_db::engine::Branch::count", reason = "use try_count" },
    { path = "arkiv_db::engine::Branch::terms", reason = "use try_terms" },
    { path = "arkiv_db::engine::Branch::namespace_count", reason = "use try_namespace_count" },
    { path = "arkiv_db::engine::Branch::record_count", reason = "use try_record_count" },
    { path = "arkiv_db::engine::Branch::typed_record_count", reason = "use try_typed_record_count" },
    { path = "arkiv_db::engine::Branch::term_count", reason = "use try_term_count" },
    { path = "arkiv_db::engine::Branch::index_consistent", reason = "use try_index_consistent" },
    { path = "arkiv_db::engine::Snapshot::get", reason = "use try_get" },
    { path = "arkiv_db::engine::Snapshot::scan_prefix", reason = "use try_scan_prefix" },
    { path = "arkiv_db::engine::Snapshot::descriptor", reason = "use try_descriptor" },
    { path = "arkiv_db::engine::Snapshot::get_record", reason = "use try_get_record" },
    { path = "arkiv_db::engine::Snapshot::query", reason = "use try_query" },
    { path = "arkiv_db::engine::Snapshot::count", reason = "use try_count" },
    { path = "arkiv_db::engine::Snapshot::terms", reason = "use try_terms" },
    { path = "arkiv_db::engine::Snapshot::namespace_count", reason = "use try_namespace_count" },
    { path = "arkiv_db::engine::Snapshot::record_count", reason = "use try_record_count" },
    { path = "arkiv_db::engine::Snapshot::records_shared_with", reason = "use try_records_shared_with" },
    { path = "arkiv_db::engine::Snapshot::typed_record_count", reason = "use try_typed_record_count" },
    { path = "arkiv_db::engine::Snapshot::term_count", reason = "use try_term_count" },
    { path = "arkiv_db::engine::Snapshot::typed_shared_with", reason = "use try_typed_shared_with" },
    { path = "arkiv_db::engine::Snapshot::index_consistent", reason = "use try_index_consistent" },
    { path = "arkiv_db::host::expire_records", reason = "use try_expire_records" },
]
