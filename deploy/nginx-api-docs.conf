# Include inside the existing full-node TLS server block.
# Static docs can be published without restarting a node. Keep these files
# from the same repository revision as the API being documented (arkiv-v2).
location = /docs {
    alias /var/www/arkiv-state-db-docs/current/state-docs.html;
    default_type text/html;
    add_header Cache-Control "no-cache";
}
location = /docs/ {
    return 308 /docs;
}
location = /openapi.json {
    alias /var/www/arkiv-state-db-docs/current/state-openapi.json;
    default_type application/json;
    add_header Cache-Control "no-cache";
}
